<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b33"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="회계 OX"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>공기업 회계 OX 마스터</title><style>
:root{font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;color:#17233b;background:#f4f6fb}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer}.shell{max-width:620px;margin:auto;min-height:100vh;padding:22px 18px 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:22px;font-weight:850;letter-spacing:-1px}.muted{color:#71809a;font-size:13px}.pill{border:1px solid #dce2ed;background:#fff;border-radius:30px;padding:8px 12px;font-size:12px}.hero{margin:23px 0;padding:23px;border-radius:24px;background:linear-gradient(135deg,#17284d,#324f96);color:#fff}.hero h1{margin:6px 0 12px;font-size:26px;letter-spacing:-1px}.hero p{margin:0;color:#d7e2ff;font-size:13px;line-height:1.6}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.metric,.panel{background:#fff;border:1px solid #e5eaf2;border-radius:18px;padding:16px}.metric strong{display:block;font-size:23px;margin-top:8px}.section{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}.section h2{margin:0;font-size:18px}.btn{border:0;border-radius:14px;padding:14px 16px;background:#284fc1;color:white;font-weight:750}.btn.secondary{background:#edf2ff;color:#2648a8}.btn.ghost{background:white;border:1px solid #dce3ef;color:#334461}.btn:disabled{opacity:.4;cursor:not-allowed}.full{width:100%}.quiz{padding:23px}.qmeta{display:flex;justify-content:space-between;color:#64748b;font-size:12px;gap:8px}.question{font-size:21px;line-height:1.6;font-weight:760;letter-spacing:-.5px;min-height:120px;margin:24px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{border:2px solid #dfe6f4;background:#fff;border-radius:17px;font-size:35px;font-weight:800;height:88px;color:#2850ba}.choice.selected{border-color:#315de0;background:#eff3ff}.result{margin-top:16px;border-radius:14px;background:#f0f5ff;padding:15px;line-height:1.65;font-size:14px}.result.good{background:#e9f8ef}.result.bad{background:#fff0ef}.bar{height:8px;background:#e9edf5;border-radius:99px;overflow:hidden;margin:14px 0}.bar>div{height:100%;background:#4167e0;transition:width .2s}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e1e6ef;display:flex;justify-content:center;padding:10px 5px max(12px,env(safe-area-inset-bottom));z-index:5}.tab{width:min(25%,150px);border:0;background:none;color:#78849b;font-size:12px;padding:5px}.tab.active{color:#234fbd;font-weight:800}.tab span{display:block;font-size:22px;margin-bottom:3px}.type{display:flex;justify-content:space-between;align-items:center;text-align:left;width:100%;border:1px solid #e5eaf2;border-radius:14px;background:#fff;padding:15px;margin-bottom:9px;gap:12px}.type small{color:#7c8aa0}.type strong{display:block;font-size:14px;margin-top:3px}.empty{text-align:center;color:#74829b;padding:38px 12px;line-height:1.7}.wrong{padding:15px;margin:10px 0}.wrong strong{display:block;line-height:1.6}.wrong p{font-size:13px;color:#65748a;line-height:1.6}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.hidden{display:none!important}.small{font-size:12px}.notice{font-size:12px;color:#6d7d95;line-height:1.7;margin:14px 2px}.link{color:#3157bc;text-decoration:none}.install{background:#e9efff;padding:15px;border-radius:14px;font-size:13px;line-height:1.7}.badge{background:#edf2ff;color:#3156b4;padding:6px 10px;border-radius:30px;font-size:11px;font-weight:700}
</style></head><body><div class="shell"><header class="top"><div><div class="brand">📘 회계 OX 마스터</div><div class="muted">공기업 회계학 · 하루 10문제</div></div><span class="pill" id="date"></span></header><main id="view"></main></div><nav class="tabs"><button class="tab active" data-tab="home"><span>⌂</span>홈</button><button class="tab" data-tab="types"><span>▦</span>유형별</button><button class="tab" data-tab="wrong"><span>✎</span>오답노트</button><button class="tab" data-tab="stats"><span>◴</span>통계</button></nav><script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let bank={titles:[],questions:[]},tab='home',session=null;
const key='ox-accounting-v1';let state;try{state=JSON.parse(localStorage.getItem(key))||{answers:{},sessions:{}}}catch{state={answers:{},sessions:{}}}state.answers??={};state.sessions??={};const save=()=>{try{localStorage.setItem(key,JSON.stringify(state))}catch{alert('저장 공간을 사용할 수 없습니다.')}};
const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const hash=s=>[...s].reduce((a,c)=>(Math.imul(a,31)+c.charCodeAt(0))|0,7);const shuffle=(a,seed)=>a.slice().sort((x,y)=>hash(seed+x.id)-hash(seed+y.id));
function daily(){let day=today(),id='daily:'+day;if(!state.sessions[id]){let pool=bank.questions.filter(q=>!state.answers[q.id]?.length);let list=shuffle(pool.length>=10?pool:bank.questions,day).slice(0,10);state.sessions[id]=list.map(x=>x.id);save()}return state.sessions[id]}
function stats(){let arr=Object.values(state.answers).flat(),correct=arr.filter(a=>a.correct).length;return {attempts:arr.length,correct,rate:arr.length?Math.round(correct/arr.length*100):0,wrong:bank.questions.filter(q=>state.answers[q.id]?.at(-1)?.correct===false).length}}
function nav(next){tab=next;session=null;render()}
function start(ids,title){session={ids,index:0,title};tab='quiz';render()}
function answer(v){if(!session)return;let id=session.ids[session.index];let q=bank.questions.find(x=>x.id===id);if(session.selected)return;session.selected=v;state.answers[id]??=[];state.answers[id].push({correct:v===q.a,answer:v,at:new Date().toISOString()});save();render()}
function next(){if(session.index===session.ids.length-1){session.done=true}else{session.index++;session.selected=null}render()}
function header(title,extra=''){return `<div class="section"><h2>${title}</h2>${extra}</div>`}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#date').textContent=new Date().toLocaleDateString('ko-KR',{month:'short',day:'numeric'});let s=stats(),v='';
if(tab==='home'){let ids=daily(),done=ids.filter(id=>state.answers[id]?.length).length;v=`<div class="hero"><div class="small">오늘의 학습</div><h1>하루 10문제,<br>실력이 쌓이는 습관</h1><p>PDF 내용을 바탕으로 만든 OX 문제를 풀고<br>오답을 반복해서 복습해 보세요.</p></div><div class="metrics"><div class="metric"><div class="muted">누적 풀이</div><strong>${s.attempts}</strong></div><div class="metric"><div class="muted">정답률</div><strong>${s.rate}%</strong></div><div class="metric"><div class="muted">오답 수</div><strong>${s.wrong}</strong></div></div>${header('오늘의 10문제',`<span class="badge">${done}/10 풀이 기록</span>`)}<div class="panel"><div class="row"><strong>오늘의 OX 챌린지</strong><span class="muted">매일 자정 갱신</span></div><div class="bar"><div style="width:${done*10}%"></div></div><button class="btn full" onclick="start(daily(),'오늘의 10문제')">${done?'다시 풀기':'문제 풀기'} →</button></div>${header('빠른 학습')}<button class="type" onclick="nav('types')"><div><strong>📚 유형별 문제 풀기</strong><small>51개 유형 중 원하는 영역 선택</small></div>›</button><button class="type" onclick="nav('wrong')"><div><strong>📝 오답 다시 풀기</strong><small>최근 틀린 문제를 집중 복습</small></div>›</button><p class="notice">문제는 업로드한 교재의 설명을 토대로 구성한 학습용 재구성 문항이며 원문 전체를 복제한 것은 아닙니다. 일부 유형은 문항 수가 적습니다.</p>`}
else if(tab==='types'){v=header('유형별 학습',`<span class="badge">총 ${bank.questions.length}문제</span>`)+bank.titles.map((name,i)=>{let list=bank.questions.filter(q=>q.type===i+1),done=list.filter(q=>state.answers[q.id]?.length).length;return `<button class="type" onclick="start(bank.questions.filter(q=>q.type===${i+1}).map(q=>q.id),'유형 ${String(i+1).padStart(2,'0')}')"><div><small>유형 ${String(i+1).padStart(2,'0')}</small><strong>${esc(name)}</strong></div><span class="muted">${done}/${list.length} ›</span></button>`}).join('')}
else if(tab==='wrong'){let wrong=bank.questions.filter(q=>state.answers[q.id]?.at(-1)?.correct===false);v=header('오답노트',`<span class="badge">${wrong.length}문제</span>`)+(wrong.length?`<button class="btn full" onclick="start(bank.questions.filter(q=>state.answers[q.id]?.at(-1)?.correct===false).map(q=>q.id),'오답 복습')">오답 전체 다시 풀기 →</button>`+wrong.map(q=>`<div class="panel wrong"><div class="muted">유형 ${q.type} · 교재 ${q.page}쪽</div><strong>${esc(q.q)}</strong><p>정답 ${q.a} · ${esc(q.exp)}</p></div>`).join(''):`<div class="empty">아직 오답이 없어요.<br>문제를 풀면 이곳에 자동으로 모입니다.</div>`)}
else if(tab==='stats'){let used=bank.questions.filter(q=>state.answers[q.id]?.length).length;v=header('학습 통계')+`<div class="metrics"><div class="metric"><div class="muted">누적 풀이</div><strong>${s.attempts}</strong></div><div class="metric"><div class="muted">정답률</div><strong>${s.rate}%</strong></div><div class="metric"><div class="muted">학습 문항</div><strong>${used}</strong></div></div><div class="panel"><strong>전체 문제은행 학습 진도</strong><div class="bar"><div style="width:${Math.round(used/bank.questions.length*100)}%"></div></div><div class="muted">${used} / ${bank.questions.length}문제</div></div>${header('유형별 정답률')}<div class="panel">`+bank.titles.map((name,i)=>{let qs=bank.questions.filter(q=>q.type===i+1),a=qs.flatMap(q=>state.answers[q.id]||[]);return `<div style="margin-bottom:13px"><div class="row small"><span>${i+1}. ${esc(name)}</span><strong>${a.length?Math.round(a.filter(x=>x.correct).length/a.length*100)+'%':'미학습'}</strong></div><div class="bar"><div style="width:${a.length?Math.round(a.filter(x=>x.correct).length/a.length*100):0}%"></div></div></div>`}).join('')+`</div><p class="notice">기록은 현재 브라우저에만 저장됩니다. 다른 기기와 자동 동기화되지 않으며 브라우저 데이터를 지우면 기록이 사라질 수 있습니다.</p><button class="btn ghost full" onclick="exportData()">학습 기록 백업(JSON)</button><div style="height:10px"></div><button class="btn ghost full" onclick="$('#restore').click()">학습 기록 복원</button><input id="restore" class="hidden" type="file" accept="application/json" onchange="importData(event)">`}
else if(tab==='quiz'){if(session.done){let n=session.ids.filter(id=>state.answers[id]?.at(-1)?.correct).length;v=`<div class="hero"><h1>학습 완료! 🎉</h1><p>마지막 풀이 기준 ${session.ids.length}문제 중 ${n}문제 정답</p></div><button class="btn full" onclick="nav('home')">홈으로 돌아가기</button>`}else{let q=bank.questions.find(x=>x.id===session.ids[session.index]),chosen=session.selected;v=`<div class="section"><h2>${esc(session.title)}</h2><button class="pill" onclick="nav('home')">닫기 ×</button></div><div class="panel quiz"><div class="qmeta"><span>유형 ${q.type} · 교재 ${q.page}쪽</span><strong>${session.index+1} / ${session.ids.length}</strong></div><div class="bar"><div style="width:${session.index/session.ids.length*100}%"></div></div><div class="question">${esc(q.q)}</div><div class="answers"><button class="choice ${chosen==='O'?'selected':''}" ${chosen?'disabled':''} onclick="answer('O')">O</button><button class="choice ${chosen==='X'?'selected':''}" ${chosen?'disabled':''} onclick="answer('X')">X</button></div>${chosen?`<div class="result ${chosen===q.a?'good':'bad'}"><strong>${chosen===q.a?'✓ 정답입니다!':'✕ 틀렸어요.'} 정답: ${q.a}</strong><div>${esc(q.exp)}</div></div><div style="height:14px"></div><button class="btn full" onclick="next()">${session.index===session.ids.length-1?'결과 보기':'다음 문제 →'}</button>`:''}</div>`}}
$('#view').innerHTML=v}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='회계OX_학습기록.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(e){let f=e.target.files[0];if(!f)return;f.text().then(t=>{try{let o=JSON.parse(t);if(!o.answers||!o.sessions)throw Error();if(confirm('기존 학습 기록을 백업 파일로 교체할까요?')){state=o;save();render()}}catch{alert('올바른 학습 기록 파일이 아닙니다.')}})}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>nav(b.dataset.tab));fetch('questions.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{bank=data;render()}).catch(()=>{$('#view').innerHTML='<div class="empty">문제 데이터를 불러올 수 없습니다.<br>웹서버에 파일을 함께 업로드했는지 확인하세요.</div>'});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
